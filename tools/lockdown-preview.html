<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LOCKDOWN - unpublished author review</title>
  <link rel="stylesheet" href="../css/style.css">
  <script type="module" src="./lockdown-preview.mjs"></script>
</head>
<body>
  <main id="app">
    <h1>LOCKDOWN</h1>

    <input id="player-count" type="number" min="3" max="12" step="1" value="3">
    <p id="selection-status" role="status" aria-live="polite"></p>
    <section id="draft-content"></section>
  </main>
</body>
