<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <defs>
    <filter id="fog" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .018" numOctaves="3" seed="12" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .65 0 0 0 0 .72 0 0 0 0 .77 0 0 0 1.8 -.65"/>
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="fade" x2="0" y2="1">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".4" stop-color="white" stop-opacity=".8"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="edge"><path d="M0 0h1000v500H0z" fill="url(#fade)"/></mask>
  </defs>
  <path d="M0 0h1000v500H0z" filter="url(#fog)" mask="url(#edge)"/>
</svg>
